[project]
name = "pyeas"
version = "1.0.0.dev1"
description = "Implements Evolutionary Algorithms and tools"
readme = "README.md"
keywords=[
    'python', 
    'Differential Evolution', 
    'DE', 
    'OpenAI Evolutionary Strategy', 
    "OpenAI-ES", 
    "CMAES", 
    "Page Trend Test"
]
authors = [
    { name = "benedictjones", email = "benedictj@hotmail.co.uk" }
]
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.7",
    "numpy>=2.0",
    "pydantic>=2.12.5",
    "scipy>=1.7",
    "tqdm>=4.67.1",
]


[project.scripts]
pyeas = "pyeas:main"

[project.urls]
Homepage = "https://github.com/benedictjones/pyeas"

[dependency-groups]
dev = [
    "marimo>=0.21.1",
    "pytest>=9.0.1",
    "pyzmq>=27.1.0",
    "nbstripout>=0.9.1",
    "ipykernel>=7.2.0",
]

[build-system]
requires = ["uv_build>=0.9.13,<0.11.0"]
build-backend = "uv_build"


[tool.uv.build-backend]
source-exclude = ["examples/**", "tests/**", "notebooks/**"]
