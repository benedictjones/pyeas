[project]
name = "pyeas"
version = "1.0.0.dev1"
description = "Implements Evolutionary Algorithms and tools"
readme = "README.md"
keywords=[
    'python',
    'Differential Evolution',
    'DE',
    'OpenAI Evolutionary Strategy',
    "OpenAI-ES",
    "CMAES",
    "Page Trend Test"
]
authors = [
    { name = "benedictjones", email = "benedictj@hotmail.co.uk" }
]
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.7",
    "numpy>=2.0",
    "scipy>=1.7",
    "tqdm>=4.66.6",
]

[project.scripts]
pyeas = "pyeas:main"

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "marimo>=0.18.1",
    "nbstripout>=0.8.2",
    "pytest>=9.0.1",
    "pyzmq>=27.1.0",
]
